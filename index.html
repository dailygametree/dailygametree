<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;700&family=Space+Grotesk:wght@700&display=swap');

:root {
  --bg: #F6F5EF;
  --bg-elevated: #EFEDE3;
  --bg-card: #FFFFFF;
  --text: #20261C;
  --text-dim: #5B6255;
  --text-faint: #9AA091;
  --accent: #6E9C1E;
  --accent-dim: #557A16;
  --accent-soft: #E7F1D4;
  --amber: #C97A1B;
  --line: #E1DDCF;
  --radius: 8px;
  --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --display: 'Fraunces', serif;
  --body: 'Public Sans', ui-sans-serif, sans-serif;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }

/* Prevents any stray overflow (e.g. from the ad rails) from ever creating
   horizontal scroll / page shift on mobile. */
html, body { overflow-x: hidden; }

body {
  margin: 0;
  background: var(--bg);
  background-image:
    radial-gradient(ellipse 700px 400px at 15% -10%, rgba(110, 156, 30, 0.06), transparent),
    radial-gradient(ellipse 600px 400px at 90% 10%, rgba(201, 122, 27, 0.05), transparent);
  color: var(--text);
  font-family: var(--body);
  line-height: 1.5;
  min-height: 100vh;
}

a { color: inherit; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

/* ---------- Header ---------- */

.site-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 28px;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: rgba(246, 245, 239, 0.88);
  backdrop-filter: blur(6px);
  z-index: 10;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  font-family: var(--display);
  font-weight: 700;
  font-size: 16px;
  letter-spacing: -0.02em;
}

.logo-mark { width: 55px; height: auto; display: block; }

/* ---------- Ad rails ---------- */
/* Rails sit close to the viewport edge on desktop so no space is wasted
   outside them. Mobile (<900px): rails flatten into a top and bottom banner. */

.layout {
  display: flex;
  align-items: stretch;
  width: 100%;
}

.ad-rail {
  flex: 0 0 160px;
  margin: 0 10px;
  position: sticky;
  top: 78px;
  align-self: stretch;
  display: flex;
  /* Sticky elements are bounded by their own box. With align-items:stretch
     on .layout, this rail's height now matches the tallest column
     (main-content), instead of a fixed px value — so the ad fills all the
     way down to the footer with no gap, and grows/shrinks with the page. */
}

.ad-slot {
  border: 1px dashed #CBC6B4;
  border-radius: var(--radius);
  background: var(--bg-elevated);
  color: var(--text-faint);
  font-size: 10.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  line-height: 1.6;
  flex: 1 1 auto;
  width: 100%;
}

.main-content {
  flex: 1;
  min-width: 0;
  display: flex;
  justify-content: center;
}

.main-inner {
  width: 100%;
  max-width: 1000px;
  padding: 0 20px;
}

@media (max-width: 900px) {
  .layout { flex-direction: column; }
  /* width: calc(...) instead of width: 100% — with a 100% width AND side
     margins, the margins add on top of the full container width and the
     rail overflows the viewport by 28px, which is what was pushing the
     whole page into unwanted horizontal scroll. calc() keeps the outer
     (margin) box exactly at 100%. */
  .ad-rail { position: static; flex: none; width: calc(100% - 28px); margin: 10px 14px; align-self: auto; display: block; }
  .ad-rail.left { order: -1; }
  .main-content { order: 0; }
  .ad-rail.right { order: 1; }
  .ad-rail .ad-slot { height: 90px; width: auto; }
  .main-inner { padding: 0 14px; }

  .site-header { padding: 14px 16px; }
  .hero { padding: 20px 20px 12px; }
}

@media (max-width: 480px) {
  .logo-text { display: none; }
  .logo { gap: 0; }
}

/* ---------- Hero ---------- */

.hero {
  max-width: 760px;
  margin: 0 auto;
  padding: 56px 24px 28px;
  text-align: center;
}

.hero h1 {
  font-family: var(--display);
  font-size: clamp(36px, 7vw, 60px);
  font-weight: 700;
  letter-spacing: -0.03em;
  margin: 0 0 14px;
  color: var(--text);
}

.hero h1 .at { color: #dedede; }
.hero h1 .brand { color: #7e5645; }
.hero h1 .tree { color: #689c1e; }

.hero .sub {
  color: var(--text-dim);
  font-size: 15px;
  max-width: 460px;
  margin: 0 auto;
}

/* ---------- Controls: search + tag filters ---------- */

.controls {
  padding: 8px 4px 28px;
}

.search-row {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 10px 14px;
  margin-bottom: 14px;
}

.search-row svg {
  width: 16px;
  height: 16px;
  color: var(--text-faint);
  flex-shrink: 0;
}

#search-input {
  border: none;
  outline: none;
  background: transparent;
  font-family: var(--body);
  font-size: 14px;
  color: var(--text);
  width: 100%;
}

#search-input::placeholder { color: var(--text-faint); }

.filters-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.tag-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  flex: 1 1 auto;
  min-width: 0;
}

.tag-pill.tag-more {
  border-style: dashed;
  color: var(--text-faint);
}

.tag-pill.tag-more:hover {
  border-style: solid;
}

.random-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--accent);
  background: var(--bg-card);
  color: var(--accent-dim);
  font-family: var(--mono);
  font-size: 12px;
  padding: 6px 14px;
  border-radius: 999px;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  transition: background 0.15s, color 0.15s, transform 0.1s;
}

.random-btn svg {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
  transition: transform 0.4s ease;
}

.random-btn:hover {
  background: var(--accent);
  color: #fff;
}

.random-btn:active { transform: scale(0.96); }

.random-btn.is-loading svg { animation: spin 0.6s linear infinite; }

@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 480px) {
  .random-btn span { display: none; }
  .random-btn { padding: 8px; }
}

.tag-pill {
  border: 1px solid var(--line);
  background: var(--bg-card);
  color: var(--text-dim);
  font-family: var(--mono);
  font-size: 12px;
  padding: 6px 12px;
  border-radius: 999px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}

.tag-pill:hover { border-color: var(--accent); color: var(--accent-dim); }

.tag-pill.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #FFFFFF;
}

/* ---------- Games grid ---------- */

.games-section { padding: 0 4px 100px; }

.games-label {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text-faint);
  margin: 0 0 14px 2px;
}

.games-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px;
  list-style: none;
  margin: 0;
  padding: 0;
}

@media (max-width: 820px) {
  .games-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 560px) {
  .games-grid { grid-template-columns: 1fr; }
}

.game-tile {
  opacity: 0;
  transform: translateY(8px);
  animation: reveal 0.4s ease forwards;
}

@keyframes reveal {
  to { opacity: 1; transform: translateY(0); }
}

.game-card {
  display: block;
  text-decoration: none;
  color: var(--text);
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  height: 100%;
  transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
}

.game-card:hover,
.game-card:focus-visible {
  transform: translateY(-4px);
  border-color: var(--accent);
  box-shadow: 0 10px 24px rgba(32, 38, 28, 0.1);
}

.game-photo {
  position: relative;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  background: var(--bg-elevated);
}

.game-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.35s ease;
}

.game-card:hover .game-photo img { transform: scale(1.06); }

.play-overlay {
  position: absolute;
  inset: 0;
  background: rgba(32, 38, 28, 0.35);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-family: var(--display);
  font-weight: 700;
  font-size: 14px;
  opacity: 0;
  transition: opacity 0.18s ease;
}

.game-card:hover .play-overlay,
.game-card:focus-visible .play-overlay { opacity: 1; }

.badge {
  position: absolute;
  top: 10px;
  left: 10px;
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 999px;
  background: var(--accent);
  color: #fff;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.game-info { padding: 14px 16px 16px; border-top: 1px solid var(--line); }

.game-title {
  font-family: 'Space Grotesk', ui-sans-serif, sans-serif;
  font-size: 16.5px;
  font-weight: 700;
  margin: 0 0 6px;
}

.game-desc {
  color: var(--text-dim);
  font-size: 13px;
  line-height: 1.55;
  margin: 0 0 12px;
}

.game-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.game-tags span {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--accent-dim);
  background: var(--accent-soft);
  padding: 3px 9px;
  border-radius: 999px;
}

/* empty / error state */

.empty-state {
  color: var(--text-dim);
  font-size: 13px;
  padding: 20px;
  border: 1px dashed var(--line);
  border-radius: var(--radius);
  grid-column: 1 / -1;
}

.empty-state code {
  color: var(--amber);
}

/* ---------- Hills (decorative, homepage only) ---------- */

.hills {
  width: 100%;
  height: 120px;
  margin-top: 24px;
  overflow: hidden;
  line-height: 0;
  pointer-events: none;
  user-select: none;
}

.hills svg { display: block; width: 100%; height: 100%; }

.hill-back { fill: #C6A576; opacity: 0.55; }
.hill-front { fill: var(--accent); opacity: 0.4; }

@media (max-width: 560px) {
  .hills { height: 80px; }
}

/* ---------- Footer ---------- */

footer {
  text-align: center;
  padding: 28px 24px 40px;
  color: var(--text-faint);
  font-size: 12px;
  border-top: 1px solid var(--line);
}

.footer-links {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 18px;
  margin-bottom: 10px;
}

.footer-links a {
  color: var(--text-dim);
  text-decoration: none;
}

.footer-links a:hover { color: var(--accent-dim); }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

</style>

    "description": "A daily rectangle-division logic puzzle — draw rectangles so each one contains exactly one number, matching its area, until the whole grid is covered.",
    "banner": "shikaku/banner.png",
    "favicon": "shikaku/favicon.png",
    "accent": "#3E6E92",
    "dateAdded": "2026-08-23",
    "tags": ["puzzle", "logic", "daily"],
    "hiddenTags": ["shikaku", "rectangle puzzle", "area puzzle", "block puzzle", "logic puzzle", "grid puzzle", "divide by box", "math puzzle", "japanese puzzle", "tatami", "wordle"]
  }
];

function initHeroTypewriter() {
  const normalEl = document.getElementById('typed-normal');
  const dimEl = document.getElementById('typed-dim');
  if (!normalEl || !dimEl) return;

  const normalText = 'dailygame';
  const dimText = 'tree';
  const totalChars = normalText.length + dimText.length;
  const typeDelay = 110;

  normalEl.textContent = '';
  dimEl.textContent = '';

  let i = 0;
  const typeTimer = window.setInterval(() => {
    i += 1;
    if (i <= normalText.length) {
      normalEl.textContent = normalText.slice(0, i);
    } else {
      dimEl.textContent = dimText.slice(0, i - normalText.length);
    }
    if (i >= totalChars) {
      window.clearInterval(typeTimer);
    }
  }, typeDelay);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initHeroTypewriter);
} else {
  initHeroTypewriter();
}

const gridEl = document.getElementById('games-grid');
const countEl = document.getElementById('game-count');
const searchInput = document.getElementById('search-input');
const tagFiltersEl = document.getElementById('tag-filters');
const yearEl = document.getElementById('year');

if (yearEl) yearEl.textContent = new Date().getFullYear();

let allGames = [];
let activeTags = new Set();
let tagsExpanded = false;

// Broad, genre-level tags that stay visible by default. Anything else
// (e.g. "puzzle", "daily" — present on nearly every game — plus any new
// tag a future game introduces) is tucked behind the "More" toggle, so
// this list is the only thing to touch to promote a new tag to "core".
const CORE_TAGS = ['history', 'logic', 'math', 'word'];

function daysAgo(dateStr) {
  const then = new Date(dateStr);
  const now = new Date();
  return Math.floor((now - then) / (1000 * 60 * 60 * 24));
}

function renderEmpty(message) {
  gridEl.innerHTML = `<div class="empty-state">${message}</div>`;
}

function makeTagPill(tag) {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'tag-pill';
  btn.textContent = tag;
  if (activeTags.has(tag)) btn.classList.add('active');
  btn.addEventListener('click', () => {
    if (activeTags.has(tag)) activeTags.delete(tag);
    else activeTags.add(tag);
    btn.classList.toggle('active');
    applyFilters();
  });
  return btn;
}

function renderTagFilters(games) {
  const tagSet = new Set();
  games.forEach((g) => (g.tags || []).forEach((t) => tagSet.add(t)));
  const allTags = [...tagSet].sort();
  const coreTags = CORE_TAGS.filter((t) => tagSet.has(t));
  const extraTags = allTags.filter((t) => !CORE_TAGS.includes(t));

  tagFiltersEl.innerHTML = '';
  coreTags.forEach((tag) => tagFiltersEl.appendChild(makeTagPill(tag)));

  if (extraTags.length) {
    if (tagsExpanded) {
      extraTags.forEach((tag) => tagFiltersEl.appendChild(makeTagPill(tag)));
    }
    const moreBtn = document.createElement('button');
    moreBtn.type = 'button';
    moreBtn.className = 'tag-pill tag-more';
    moreBtn.textContent = tagsExpanded ? 'Less −' : `More +${extraTags.length}`;
    moreBtn.setAttribute('aria-expanded', tagsExpanded ? 'true' : 'false');
    moreBtn.addEventListener('click', () => {
      tagsExpanded = !tagsExpanded;
      renderTagFilters(allGames);
    });
    tagFiltersEl.appendChild(moreBtn);
  }
}

function applyFilters() {
  const query = searchInput.value.trim().toLowerCase();
  const filtered = allGames.filter((game) => {
    const matchesQuery =
      !query ||
      game.title.toLowerCase().includes(query) ||
      (game.description || '').toLowerCase().includes(query) ||
      (game.tags || []).some((t) => t.toLowerCase().includes(query)) ||
      (game.hiddenTags || []).some((t) => t.toLowerCase().includes(query));
    const matchesTags =
      activeTags.size === 0 || (game.tags || []).some((t) => activeTags.has(t));
    return matchesQuery && matchesTags;
  });
  renderGrid(filtered);
}

function renderGrid(games) {
  countEl.textContent = games.length;
  if (games.length === 0) {
    renderEmpty('No games match that search. Try a different word or clear the tag filters.');
    return;
  }
  gridEl.innerHTML = '';
  games.forEach((game, i) => {
    const li = document.createElement('li');
    li.className = 'game-tile';
    li.style.animationDelay = `${Math.min(i, 9) * 50}ms`;
    const isNew = daysAgo(game.dateAdded) <= 14;
    const tagsHtml = (game.tags || []).map((t) => `<span>${t}</span>`).join('');

    const card = document.createElement('a');
    card.className = 'game-card';
    card.href = `/${game.folder}/`;
    card.innerHTML = `
      <div class="game-photo">
        <img src="${game.banner}" alt="${game.title}" loading="lazy">
        ${isNew ? '<span class="badge">new</span>' : ''}
        <div class="play-overlay">Play &#8594;</div>
      </div>
      <div class="game-info">
        <h3 class="game-title">${game.title}</h3>
        <p class="game-desc">${game.description || ''}</p>
        <div class="game-tags">${tagsHtml}</div>
      </div>
    `;
    li.appendChild(card);
    gridEl.appendChild(li);
  });
}

function loadGames() {
  fetch('games.json')
    .then((res) => {
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    })
    .then((games) => {
      allGames = games;
      allGames.sort((a, b) => new Date(b.dateAdded) - new Date(a.dateAdded));
      renderTagFilters(allGames);
      renderGrid(allGames);
    })
    .catch((err) => {
      console.error('Could not load games.json, using fallback list:', err);
      allGames = FALLBACK_GAMES.slice();
      allGames.sort((a, b) => new Date(b.dateAdded) - new Date(a.dateAdded));
      renderTagFilters(allGames);
      renderGrid(allGames);
    });
}

searchInput.addEventListener('input', applyFilters);
loadGames();

</script>
<script src="/random-game.js" defer></script>
</body>
</html>
