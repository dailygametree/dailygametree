<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>dailygametree</title>
<meta name="description" content="A growing collection of small browser games, one folder per game." />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root {
  --bg: #F6F5EF;
  --bg-elevated: #EFEDE3;
  --bg-card: #FFFFFF;
  --text: #20261C;
  --text-dim: #5B6255;
  --text-faint: #9AA091;
  --accent: #6E9C1E;
  --accent-dim: #557A16;
  --accent-soft: #E7F1D4;
  --amber: #C97A1B;
  --line: #E1DDCF;
  --radius: 8px;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --display: 'Space Grotesk', ui-sans-serif, sans-serif;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--bg);
  background-image:
    radial-gradient(ellipse 700px 400px at 15% -10%, rgba(110, 156, 30, 0.06), transparent),
    radial-gradient(ellipse 600px 400px at 90% 10%, rgba(201, 122, 27, 0.05), transparent);
  color: var(--text);
  font-family: var(--mono);
  line-height: 1.5;
  min-height: 100vh;
}

a { color: inherit; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

/* ---------- Header ---------- */

.site-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 28px;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: rgba(246, 245, 239, 0.88);
  backdrop-filter: blur(6px);
  z-index: 10;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  font-family: var(--display);
  font-weight: 700;
  font-size: 16px;
  letter-spacing: -0.02em;
}

.logo-mark { width: 22px; height: 22px; display: block; }

/* ---------- Ad rails ---------- */
/* Rails sit close to the viewport edge on desktop so no space is wasted
   outside them. Mobile (<900px): rails flatten into a top and bottom banner. */

.layout {
  display: flex;
  align-items: flex-start;
  width: 100%;
}

.ad-rail {
  flex: 0 0 160px;
  margin: 0 10px;
  position: sticky;
  top: 78px;
}

.ad-slot {
  border: 1px dashed #CBC6B4;
  border-radius: var(--radius);
  background: var(--bg-elevated);
  color: var(--text-faint);
  font-size: 10.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  line-height: 1.6;
}

.ad-rail .ad-slot { height: 600px; }

.main-content {
  flex: 1;
  min-width: 0;
  display: flex;
  justify-content: center;
}

.main-inner {
  width: 100%;
  max-width: 1000px;
  padding: 0 20px;
}

@media (max-width: 900px) {
  .layout { flex-direction: column; }
  .ad-rail { position: static; flex: none; width: 100%; margin: 10px 14px; }
  .ad-rail.left { order: -1; }
  .main-content { order: 0; }
  .ad-rail.right { order: 1; }
  .ad-rail .ad-slot { height: 90px; width: auto; }
  .main-inner { padding: 0 14px; }
}

/* ---------- Hero ---------- */

.hero {
  max-width: 760px;
  margin: 0 auto;
  padding: 56px 24px 28px;
  text-align: center;
}

.hero h1 {
  font-family: var(--display);
  font-size: clamp(36px, 7vw, 60px);
  font-weight: 700;
  letter-spacing: -0.03em;
  margin: 0 0 14px;
  color: var(--text);
}

.hero h1 .dim { color: var(--text-faint); }

.cursor {
  display: inline-block;
  color: var(--accent);
  opacity: 1;
}

.cursor.blink {
  animation: cursor-blink 1s steps(2, start) infinite;
}

@keyframes cursor-blink {
  to { opacity: 0; }
}

.hero .sub {
  color: var(--text-dim);
  font-size: 15px;
  max-width: 460px;
  margin: 0 auto;
}

/* ---------- Controls: search + tag filters ---------- */

.controls {
  padding: 8px 4px 28px;
}

.search-row {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 10px 14px;
  margin-bottom: 14px;
}

.search-row svg {
  width: 16px;
  height: 16px;
  color: var(--text-faint);
  flex-shrink: 0;
}

#search-input {
  border: none;
  outline: none;
  background: transparent;
  font-family: var(--mono);
  font-size: 14px;
  color: var(--text);
  width: 100%;
}

#search-input::placeholder { color: var(--text-faint); }

.tag-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.tag-pill {
  border: 1px solid var(--line);
  background: var(--bg-card);
  color: var(--text-dim);
  font-family: var(--mono);
  font-size: 12px;
  padding: 6px 12px;
  border-radius: 999px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}

.tag-pill:hover { border-color: var(--accent); color: var(--accent-dim); }

.tag-pill.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #FFFFFF;
}

/* ---------- Games grid ---------- */

.games-section { padding: 0 4px 100px; }

.games-label {
  font-size: 12px;
  color: var(--text-faint);
  margin: 0 0 14px 2px;
}

.games-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px;
  list-style: none;
  margin: 0;
  padding: 0;
}

@media (max-width: 820px) {
  .games-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 560px) {
  .games-grid { grid-template-columns: 1fr; }
}

.game-tile {
  opacity: 0;
  transform: translateY(8px);
  animation: reveal 0.4s ease forwards;
}

@keyframes reveal {
  to { opacity: 1; transform: translateY(0); }
}

.game-card {
  display: block;
  text-decoration: none;
  color: var(--text);
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  height: 100%;
  transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
}

.game-card:hover,
.game-card:focus-visible {
  transform: translateY(-4px);
  border-color: var(--accent);
  box-shadow: 0 10px 24px rgba(32, 38, 28, 0.1);
}

.game-photo {
  position: relative;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  background: var(--bg-elevated);
}

.game-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.35s ease;
}

.game-card:hover .game-photo img { transform: scale(1.06); }

.play-overlay {
  position: absolute;
  inset: 0;
  background: rgba(32, 38, 28, 0.35);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-family: var(--display);
  font-weight: 700;
  font-size: 14px;
  opacity: 0;
  transition: opacity 0.18s ease;
}

.game-card:hover .play-overlay,
.game-card:focus-visible .play-overlay { opacity: 1; }

.badge {
  position: absolute;
  top: 10px;
  left: 10px;
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 999px;
  background: var(--accent);
  color: #fff;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.game-info { padding: 14px 16px 16px; }

.game-title {
  font-family: var(--display);
  font-size: 16.5px;
  font-weight: 700;
  margin: 0 0 6px;
}

.game-desc {
  color: var(--text-dim);
  font-size: 13px;
  line-height: 1.55;
  margin: 0 0 12px;
}

.game-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.game-tags span {
  font-size: 10.5px;
  color: var(--accent-dim);
  background: var(--accent-soft);
  padding: 3px 9px;
  border-radius: 999px;
}

/* empty / error state */

.empty-state {
  color: var(--text-dim);
  font-size: 13px;
  padding: 20px;
  border: 1px dashed var(--line);
  border-radius: var(--radius);
  grid-column: 1 / -1;
}

.empty-state code {
  color: var(--amber);
}

/* ---------- Footer ---------- */

footer {
  text-align: center;
  padding: 28px 24px 40px;
  color: var(--text-faint);
  font-size: 12px;
  border-top: 1px solid var(--line);
}

.footer-links {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 18px;
  margin-bottom: 10px;
}

.footer-links a {
  color: var(--text-dim);
  text-decoration: none;
}

.footer-links a:hover { color: var(--accent-dim); }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

</style>

function initHeroTypewriter() {
  const normalEl = document.getElementById('typed-normal');
  const dimEl = document.getElementById('typed-dim');
  const cursorEl = document.getElementById('hero-cursor');
  if (!normalEl || !dimEl || !cursorEl) return;

  const normalText = 'dailygame';
  const dimText = 'tree';
  const totalChars = normalText.length + dimText.length;
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const typeDelay = reduceMotion ? 25 : 85;

  // Reset to a known empty state every time this runs, so the cursor
  // never starts out already blinking before typing has finished.
  normalEl.textContent = '';
  dimEl.textContent = '';
  cursorEl.classList.remove('blink');

  let i = 0;
  const timer = window.setInterval(() => {
    i += 1;
    if (i <= normalText.length) {
      normalEl.textContent = normalText.slice(0, i);
    } else {
      dimEl.textContent = dimText.slice(0, i - normalText.length);
    }
    if (i >= totalChars) {
      window.clearInterval(timer);
      // Small pause on the finished word before the cursor starts
      // blinking, so it doesn't read as a jump-cut.
      window.setTimeout(() => cursorEl.classList.add('blink'), 200);
    }
  }, typeDelay);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initHeroTypewriter);
} else {
  initHeroTypewriter();
}

const gridEl = document.getElementById('games-grid');
const countEl = document.getElementById('game-count');
const searchInput = document.getElementById('search-input');
const tagFiltersEl = document.getElementById('tag-filters');
const yearEl = document.getElementById('year');

if (yearEl) yearEl.textContent = new Date().getFullYear();

let allGames = [];
let activeTags = new Set();

function daysAgo(dateStr) {
  const then = new Date(dateStr);
  const now = new Date();
  return Math.floor((now - then) / (1000 * 60 * 60 * 24));
}

function renderEmpty(message) {
  gridEl.innerHTML = `<div class="empty-state">${message}</div>`;
}

function renderTagFilters(games) {
  const tagSet = new Set();
  games.forEach((g) => (g.tags || []).forEach((t) => tagSet.add(t)));
  const tags = [...tagSet].sort();
  tagFiltersEl.innerHTML = '';
  tags.forEach((tag) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'tag-pill';
    btn.textContent = tag;
    btn.addEventListener('click', () => {
      if (activeTags.has(tag)) activeTags.delete(tag);
      else activeTags.add(tag);
      btn.classList.toggle('active');
      applyFilters();
    });
    tagFiltersEl.appendChild(btn);
  });
}

function applyFilters() {
  const query = searchInput.value.trim().toLowerCase();
  const filtered = allGames.filter((game) => {
    const matchesQuery =
      !query ||
      game.title.toLowerCase().includes(query) ||
      (game.description || '').toLowerCase().includes(query) ||
      (game.tags || []).some((t) => t.toLowerCase().includes(query));
    const matchesTags =
      activeTags.size === 0 || (game.tags || []).some((t) => activeTags.has(t));
    return matchesQuery && matchesTags;
  });
  renderGrid(filtered);
}

function renderGrid(games) {
  countEl.textContent = games.length;
  if (games.length === 0) {
    renderEmpty('No games match that search. Try a different word or clear the tag filters.');
    return;
  }
  gridEl.innerHTML = '';
  games.forEach((game, i) => {
    const li = document.createElement('li');
    li.className = 'game-tile';
    li.style.animationDelay = `${Math.min(i, 9) * 50}ms`;
    const isNew = daysAgo(game.dateAdded) <= 14;
    const tagsHtml = (game.tags || []).map((t) => `<span>${t}</span>`).join('');

    const card = document.createElement('a');
    card.className = 'game-card';
    card.href = `games/${game.folder}/index.html`;
    card.innerHTML = `
      <div class="game-photo">
        <img src="${game.banner}" alt="${game.title}" loading="lazy">
        ${isNew ? '<span class="badge">new</span>' : ''}
        <div class="play-overlay">Play &#8594;</div>
      </div>
      <div class="game-info">
        <h3 class="game-title">${game.title}</h3>
        <p class="game-desc">${game.description || ''}</p>
        <div class="game-tags">${tagsHtml}</div>
      </div>
    `;
    li.appendChild(card);
    gridEl.appendChild(li);
  });
}

function loadGames() {
  // This preview file is standalone (no games.json sitting next to it), so
  // it renders directly from the fallback list. The real index.html in the
  // project fetches games.json instead.
  allGames = FALLBACK_GAMES.slice();
  allGames.sort((a, b) => new Date(b.dateAdded) - new Date(a.dateAdded));
  renderTagFilters(allGames);
  renderGrid(allGames);
}

searchInput.addEventListener('input', applyFilters);
loadGames();

</script>
</body>
</html>
