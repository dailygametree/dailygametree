<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The 67 Number Game — Yesterday's Solutions — dailygametree</title>
<meta name="description" content="Use four numbers and maths to make 67. A new puzzle every day.">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ---------- Site-wide palette (drives header / ad rails / footer) ---------- */
:root{
  --bg: #F6F5EF;
  --bg-elevated: #EFEDE3;
  --bg-card: #FFFFFF;
  --text: #20261C;
  --text-dim: #5B6255;
  --text-faint: #9AA091;
  --accent: #6E9C1E;
  --accent-dim: #557A16;
  --accent-soft: #E7F1D4;
  --amber: #C97A1B;
  --line: #E1DDCF;
  --radius: 8px;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --display: 'Space Grotesk', ui-sans-serif, sans-serif;
}

html,body{
  min-height:100%;
  background:var(--bg);
  font-family:var(--mono);
  color:var(--text);
  overflow-x:hidden;
}

a{ color:inherit; }

/* ---------- Header (identical to homepage) ---------- */

.site-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 28px;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: rgba(246, 245, 239, 0.88);
  backdrop-filter: blur(6px);
  z-index: 10;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  font-family: var(--display);
  font-weight: 700;
  font-size: 16px;
  letter-spacing: -0.02em;
}

.logo-mark { width: 55px; height: auto; display: block; }

/* ---------- Ad rails (identical to homepage) ---------- */

.layout {
  display: flex;
  align-items: flex-start;
  width: 100%;
}

.ad-rail {
  flex: 0 0 160px;
  margin: 0 10px;
  position: sticky;
  top: 78px;
}

.ad-slot {
  border: 1px dashed #CBC6B4;
  border-radius: var(--radius);
  background: var(--bg-elevated);
  color: var(--text-faint);
  font-size: 10.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  line-height: 1.6;
}

.ad-rail .ad-slot { height: 600px; }

.main-content {
  flex: 1;
  min-width: 0;
  display: flex;
  justify-content: center;
}

.main-inner {
  width: 100%;
  max-width: 1000px;
  padding: 0 20px;
}

@media (max-width: 900px) {
  .layout { flex-direction: column; }
  /* width: calc(...) instead of width: 100% — with a 100% width AND side
     margins, the margins add on top of the full container width and the
     rail overflows the viewport by 28px, which pushes the whole page into
     unwanted horizontal scroll. calc() keeps the outer (margin) box
     exactly at 100%. */
  .ad-rail { position: static; flex: none; width: calc(100% - 20px); margin: 6px 10px; }
  .ad-rail.left { order: -1; }
  .main-content { order: 0; }
  .ad-rail.right { order: 1; }
  .ad-rail .ad-slot { height: 40px; width: auto; font-size: 8px; }
  .main-inner { padding: 0 14px; }

  .site-header { display: none; }
  .back-link { margin: 10px 4px 0; }
  footer { display: none; }
}

@media (max-width: 480px) {
  .logo-text { display: none; }
  .logo { gap: 0; }
}

.back-link{
  display:inline-block;
  font-size:12.5px;
  color:var(--text-dim);
  text-decoration:none;
  margin:24px 4px 0;
  border:1px solid var(--line);
  border-radius:999px;
  padding:5px 12px;
  font-family:var(--mono);
  transition:border-color .15s,color .15s;
}
.back-link:hover{ border-color:var(--accent); color:var(--accent-dim); }

/* ---------- Footer (identical to homepage) ---------- */

footer {
  text-align: center;
  padding: 28px 24px 40px;
  color: var(--text-faint);
  font-size: 12px;
  border-top: 1px solid var(--line);
}

.footer-links {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 18px;
  margin-bottom: 10px;
}

.footer-links a {
  color: var(--text-dim);
  text-decoration: none;
}

.footer-links a:hover { color: var(--accent-dim); }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}


.game-wrap{
  --card:#ddd8ce;
  --black:#1a1a1a;
  --red:#c0392b;
  --white:#ffffff;
  --grey:#888;
  --amber:#c8711a;
  --amber-light:#e8d5b0;
  --font-t:'Special Elite',cursive;
  --font-b:'Courier Prime',monospace;
  --bg:#f5f0e8;

  background:var(--bg);
  font-family:var(--font-b);
  color:var(--black);
  border-radius:var(--radius);
  margin-top:14px;
  padding:32px 24px 48px;
}

@media(max-width:960px){.game-wrap{padding:20px 12px 32px}}

.title{font-family:var(--font-t);font-size:clamp(20px,4vw,34px);letter-spacing:.5px;line-height:1.2}
.divider{border:none;height:2px;background:linear-gradient(to right,var(--amber),#e8c07a,var(--amber));margin:12px 0 20px;border-radius:2px;opacity:.7}
.subtitle{font-size:14px;color:var(--grey);margin-bottom:28px;font-family:var(--font-b)}
.nums-display{display:flex;gap:14px;justify-content:center;margin-bottom:32px}
.num-tile{width:72px;height:72px;background:var(--card);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.solutions-grid{display:grid;gap:10px}
.sol-card{background:var(--white);border:1.5px solid #ccc;border-radius:10px;padding:14px 18px;font-family:var(--font-b);font-size:16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.sol-expr{flex:1;word-break:break-all;letter-spacing:.3px}
.sol-eq{color:#4a9e5c;font-weight:700;font-size:14px;white-space:nowrap}
.loading{text-align:center;padding:40px;color:var(--grey);font-size:15px}
.count-info{font-size:13px;color:var(--grey);text-align:center;margin-bottom:20px}
@media(max-width:600px){.sol-card{font-size:14px;padding:10px 14px}}

.mode-row{display:flex;align-items:center;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.mode-label{font-size:12px;color:#888;letter-spacing:.5px}
.mode-toggle{display:flex;border:2px solid var(--black);border-radius:999px;overflow:hidden}
.mode-btn{font-family:var(--font-b);font-size:13px;font-weight:700;background:transparent;border:none;padding:6px 16px;cursor:pointer;color:var(--black);transition:background .15s,color .15s;letter-spacing:.5px}
.mode-btn.active{background:var(--black);color:var(--bg)}
.mode-btn:not(.active):hover{background:var(--amber-light)}
</style>
</head>

let currentMode = (localStorage.getItem('67dle-mode') === 'hard') ? 'hard' : 'normal';

function getPuzzleList() {
  return currentMode === 'hard' ? HARD_PUZZLES : NORMAL_PUZZLES;
}

function getYesterdaysPuzzle() {
  const epoch = Date.UTC(2025, 0, 1);
  const now = new Date();
  const today = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
  const dayIdx = Math.floor((today - epoch) / 86400000) - 1;
  const list = getPuzzleList();
  const idx = ((dayIdx % list.length) + list.length) % list.length;
  return { nums: [...list[idx]], puzzleNum: idx + 1, total: list.length };
}

// ── Solver ──
function fact(n) {
  if (!Number.isInteger(n) || n < 0 || n > 20) return null;
  let f = 1; for (let i = 2; i <= n; i++) f *= i;
  return f;
}

function perms(arr) {
  if (arr.length === 0) return [[]];
  if (arr.length === 1) return [[arr[0]]];
  const out = [];
  for (let i = 0; i < arr.length; i++) {
    const rest = arr.filter((_, j) => j !== i);
    for (const p of perms(rest)) out.push([arr[i], ...p]);
  }
  return out;
}

function splits(n) {
  const out = [];
  for (let mask = 1; mask < (1 << n) - 1; mask++) {
    if (!(mask & 1)) continue;
    const left = [], right = [];
    for (let i = 0; i < n; i++) (mask >> i & 1 ? left : right).push(i);
    out.push([left, right]);
  }
  return out;
}

function allResults(nums) {
  if (nums.length === 1) {
    const n = nums[0];
    const base = [{ val: n, expr: String(n), isRaw: true }];
    if (currentMode === 'hard') {
      const f = fact(n);
      if (f !== null && isFinite(f) && f <= 1e12) {
        base.push({ val: f, expr: `${n}!`, isRaw: false });
      }
    }
    return base;
  }

  const results = [];
  for (const [leftIdx, rightIdx] of splits(nums.length)) {
    const leftNums = leftIdx.map(i => nums[i]);
    const rightNums = rightIdx.map(i => nums[i]);
    const leftRes = allResults(leftNums);
    const rightRes = allResults(rightNums);

    for (const L of leftRes) {
      for (const R of rightRes) {
        push(results, L.val + R.val, `(${L.expr}+${R.expr})`);
        push(results, L.val - R.val, `(${L.expr}-${R.expr})`);
        push(results, R.val - L.val, `(${R.expr}-${L.expr})`);
        push(results, L.val * R.val, `(${L.expr}×${R.expr})`);
        if (R.val !== 0) push(results, L.val / R.val, `(${L.expr}÷${R.expr})`);
        if (L.val !== 0) push(results, R.val / L.val, `(${R.expr}÷${L.expr})`);
        if (R.isRaw && R.val >= 0 && R.val <= 10) {
          const p = Math.pow(L.val, R.val);
          if (currentMode === 'hard' && isFinite(p) && Math.abs(p) <= 1e12) push(results, p, `(${L.expr}^${R.expr})`);
        }
        if (L.isRaw && L.val >= 0 && L.val <= 10) {
          const p = Math.pow(R.val, L.val);
          if (currentMode === 'hard' && isFinite(p) && Math.abs(p) <= 1e12) push(results, p, `(${R.expr}^${L.expr})`);
        }
      }
    }
  }
  return results;
}

function push(arr, val, expr) {
  if (isFinite(val) && Math.abs(val) <= 1e12) arr.push({ val, expr, isRaw: false });
}

function solve(nums) {
  const seen = new Set();
  const solutions = [];
  for (const perm of perms(nums)) {
    for (const r of allResults(perm)) {
      const v = Math.round(r.val * 1e9) / 1e9;
      if (v === 67 && !seen.has(r.expr)) {
        seen.add(r.expr);
        solutions.push(r.expr);
      }
    }
  }
  return solutions;
}

  document.getElementById('modeNormalBtn').classList.toggle('active', currentMode === 'normal');
  document.getElementById('modeHardBtn').classList.toggle('active', currentMode === 'hard');
}

  const modeLabel = currentMode === 'hard' ? 'Hard' : 'Normal';

  numsDisplay.innerHTML = '';

    const d = document.createElement('div');
    d.className = 'num-tile';
    d.textContent = n;
    numsDisplay.appendChild(d);
  }

  const grid = document.getElementById('solutionsGrid');
  const countInfo = document.getElementById('countInfo');
  const loadingMsg = document.getElementById('loadingMsg');
  grid.innerHTML = '';
  countInfo.style.display = 'none';
  loadingMsg.style.display = 'block';

  setTimeout(() => {
    const solutions = solve(nums);

    loadingMsg.style.display = 'none';

    if (solutions.length === 0) {
      countInfo.textContent = 'No standard solutions found for this puzzle.';
      countInfo.style.display = 'block';
      return;
    }

    const unique = [...new Set(solutions)].sort((a, b) => a.length - b.length);

    countInfo.textContent = `${unique.length} solution${unique.length !== 1 ? 's' : ''} found`;
    countInfo.style.display = 'block';

    for (const expr of unique) {
      const card = document.createElement('div');
      card.className = 'sol-card';
      const exprEl = document.createElement('span');
      exprEl.className = 'sol-expr';
      exprEl.textContent = expr;
      const eq = document.createElement('span');
      eq.className = 'sol-eq';
      eq.textContent = '= 67 ✓';
      card.appendChild(exprEl);
      card.appendChild(eq);
      grid.appendChild(card);
    }
  }, 50);
}

function setMode(mode) {
  if (mode === currentMode) return;
  currentMode = mode;
  localStorage.setItem('67dle-mode', mode);
  updateModeButtons();
  loadYesterday();
}

document.getElementById('modeNormalBtn').addEventListener('click', () => setMode('normal'));
document.getElementById('modeHardBtn').addEventListener('click', () => setMode('hard'));

updateModeButtons();
loadYesterday();
</script>
</body>
