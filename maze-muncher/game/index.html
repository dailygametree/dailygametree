<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Maze Muncher</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="game-wrap">
    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div class="hud-left">
        <span class="hud-label">SCORE</span>
        <span id="score">0</span>
      </div>
      <div class="hud-mid">
        <span class="hud-label">LEVEL</span>
        <span id="hud-level">1</span>
      </div>
      <div class="hud-right">
        <span class="hud-label">LIVES</span>
        <span id="lives-dots"></span>
      </div>
    </div>

    <!-- Start screen -->
    <div id="start-screen" class="overlay">
      <div class="panel">
        <svg class="mascot" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <!-- Munch the beetle, seen from above -->
          <g stroke="#1f8a3c" stroke-width="2.4" stroke-linecap="round" fill="none">
            <path d="M22 18 L18 9" /><path d="M30 17 L30 7" /><path d="M38 18 L42 9" />
            <path d="M22 46 L18 55" /><path d="M30 47 L30 57" /><path d="M38 46 L42 55" />
          </g>
          <ellipse cx="28" cy="32" rx="19" ry="17" fill="#5be37b" stroke="#1f8a3c" stroke-width="2.5" />
          <path d="M10 32 L36 32" stroke="#1f8a3c" stroke-width="2.2" />
          <circle cx="21" cy="25" r="2.8" fill="#3cb860" /><circle cx="21" cy="39" r="2.8" fill="#3cb860" />
          <circle cx="45" cy="32" r="9.5" fill="#3fbf62" stroke="#1f8a3c" stroke-width="2.5" />
          <path d="M53 29 Q58 25 59 30" stroke="#12351b" stroke-width="2.2" fill="none" stroke-linecap="round" />
          <path d="M53 35 Q58 39 59 34" stroke="#12351b" stroke-width="2.2" fill="none" stroke-linecap="round" />
          <circle cx="47" cy="27.5" r="2.6" fill="#fff" /><circle cx="48.4" cy="27.5" r="1.3" fill="#12351b" />
          <circle cx="47" cy="36.5" r="2.6" fill="#fff" /><circle cx="48.4" cy="36.5" r="1.3" fill="#12351b" />
          <g stroke="#1f8a3c" stroke-width="1.8" fill="none" stroke-linecap="round">
            <path d="M50 25 Q56 18 52 13" /><path d="M50 39 Q56 46 52 51" />
          </g>
          <circle cx="52" cy="13" r="2.2" fill="#ffd166" /><circle cx="52" cy="51" r="2.2" fill="#ffd166" />
        </svg>
        <h1>MAZE MUNCHER</h1>
        <p class="hint">Crunch every seed.<br />Dodge the Thornbugs&hellip; or grab a star-berry and munch <em>them</em>.</p>
        <button id="start-btn" class="btn pulse">Play</button>
        <p class="controls-hint">
          <span class="desktop-only">Arrow keys or W A S D to move</span>
          <span class="touch-only">Swipe or use the pad to move</span>
        </p>
      </div>
    </div>

    <!-- Game over screen -->
    <div id="gameover-screen" class="overlay hidden">
      <div class="panel">
        <h2 id="gameover-title">Game Over</h2>
        <p id="final-score" class="score-line">Score: 0</p>
        <p id="best-score" class="score-line best">Best: 0</p>
        <button id="restart-btn" class="btn pulse">Play Again</button>
      </div>
    </div>

    <!-- Touch d-pad -->
    <div id="dpad" class="hidden" aria-hidden="true">
      <button class="dpad-btn dpad-up" data-dir="up">&#9650;</button>
      <button class="dpad-btn dpad-left" data-dir="left">&#9664;</button>
      <button class="dpad-btn dpad-right" data-dir="right">&#9654;</button>
      <button class="dpad-btn dpad-down" data-dir="down">&#9660;</button>
    </div>

    <!-- Sound toggle — always reachable, above every screen -->
    <button id="mute-btn" class="icon-btn" type="button" aria-pressed="false" aria-label="Mute sound">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true" focusable="false">
        <path d="M3 8 H6.5 L11 4.5 V17.5 L6.5 14 H3 Z" fill="#eafff0" />
        <g class="mute-waves">
          <path d="M14.5 7.5 Q17 11 14.5 14.5" fill="none" stroke="#eafff0" stroke-width="1.8" stroke-linecap="round" />
          <path d="M16.8 5 Q20.5 11 16.8 17" fill="none" stroke="#eafff0" stroke-width="1.8" stroke-linecap="round" />
        </g>
        <path class="mute-slash" d="M14 6 L20 16" stroke="#eafff0" stroke-width="2.2" stroke-linecap="round" style="display:none" />
      </svg>
    </button>
  </div>

  <script src="./game.js"></script>
</body>
</html>
