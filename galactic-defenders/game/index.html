<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Galactic Defenders</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>
<div id="cabinet">
  <div id="marquee">GALACTIC DEFENDERS</div>
  <div id="screen-frame">
    <div id="game-wrap">
      <canvas id="gameCanvas"></canvas>
      <div id="crt-overlay"></div>

      <!-- HUD -->
      <div id="hud" class="hidden">
        <div class="hud-row">
          <div class="hud-block">
            <span class="hud-label">SCORE</span>
            <span id="score" class="hud-value">000000</span>
          </div>
          <div class="hud-block center">
            <span class="hud-label">WAVE</span>
            <span id="wave" class="hud-value">01</span>
          </div>
          <div class="hud-block right">
            <span class="hud-label">HI-SCORE</span>
            <span id="hi-score" class="hud-value">000000</span>
          </div>
        </div>
        <div id="lives" class="lives-row"></div>
        <div id="powerup-row" class="powerup-row"></div>
        <div id="boss-hp-wrap"><div id="boss-hp-fill"></div></div>
      </div>

      <!-- Start screen -->
      <div id="start-screen" class="overlay">
        <div class="panel">
          <h1>GALACTIC<br />DEFENDERS</h1>
          <p class="tagline">Earth's last gunner.<br />Hold the line, wave after wave.</p>
          <p class="stat-line" id="start-hiscore">HI-SCORE 000000</p>
          <p class="stat-line" id="start-sector-tag">SECTOR ALPHA</p>
          <button id="start-btn" class="btn">PRESS START</button>
          <p class="controls-hint">
            <span class="desktop-only">Arrows / A-D to move &middot; Space to fire</span>
            <span class="touch-only">Drag to move &middot; hold to fire</span>
          </p>
        </div>
      </div>

      <!-- Game over screen -->
      <div id="gameover-screen" class="overlay hidden">
        <div class="panel">
          <h2>GAME OVER</h2>
          <p id="final-score" class="score-line">SCORE 000000</p>
          <p id="new-high" class="newhigh hidden">NEW HI-SCORE!</p>
          <p id="best-score" class="stat-line">HI-SCORE 000000</p>
          <button id="restart-btn" class="btn amber">PRESS START</button>
        </div>
      </div>

      <!-- Wave / boss banner -->
      <div id="wave-banner" class="hidden">
        <div class="line1" id="wave-banner-line1"></div>
        <div class="line2" id="wave-banner-line2"></div>
      </div>

      <!-- Sound toggle -->
      <button id="mute-btn" class="icon-btn" type="button" aria-pressed="false" aria-label="Mute sound">
        <svg width="18" height="18" viewBox="0 0 22 22" aria-hidden="true" focusable="false">
          <path d="M3 8 H6.5 L11 4.5 V17.5 L6.5 14 H3 Z" fill="#39ff6a" />
          <g class="mute-waves">
            <path d="M14.5 7.5 Q17 11 14.5 14.5" fill="none" stroke="#39ff6a" stroke-width="1.8" stroke-linecap="round" />
            <path d="M16.8 5 Q20.5 11 16.8 17" fill="none" stroke="#39ff6a" stroke-width="1.8" stroke-linecap="round" />
          </g>
          <path class="mute-slash" d="M14 6 L20 16" stroke="#39ff6a" stroke-width="2.2" stroke-linecap="round" style="display:none" />
        </svg>
      </button>
    </div>
  </div>
</div>

<script src="./game.js"></script>
</body>
</html>
