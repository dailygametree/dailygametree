<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Chess</title>
<style>
@font-face{
  font-family:"Montserrat";
  src:url("montserrat-800.woff2") format("woff2");
  font-weight:800;
  font-style:normal;
  font-display:swap;
}

:root{
  --font-display:"Montserrat", system-ui, sans-serif;
  --font-body:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

  --page-bg:#302e2b;
  --panel-bg:#262522;
  --panel-bg-2:#1e1d1b;
  --panel-border:#3d3a35;
  --ink:#f2f0ec;
  --dim:#b9b5ab;
  --dim-2:#847f74;

  --accent:#81b64c;
  --accent-dark:#6a9a3d;
  --accent-ink:#20260f;
  --danger:#e8534f;
  --gold:#f0c14b;

  --board-light:#eeeed2;
  --board-dark:#769656;
  --highlight:#f6f66c;
  --highlight-alpha:0.62;
  --dot:rgba(20,20,20,0.28);
  --ring:rgba(20,20,20,0.32);

  --radius-lg:20px;
  --radius-md:14px;
  --radius-sm:9px;
  --shadow-lg:0 20px 50px rgba(0,0,0,0.45);
  --shadow-md:0 8px 22px rgba(0,0,0,0.32);
}

*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  font-family:var(--font-body);
  color:var(--ink);
  background-color:var(--page-bg);
  background-image:
    linear-gradient(rgba(16,15,13,0.90), rgba(16,15,13,0.90)),
    linear-gradient(45deg, var(--board-dark) 25%, transparent 25%, transparent 75%, var(--board-dark) 75%, var(--board-dark)),
    linear-gradient(45deg, var(--board-dark) 25%, var(--board-light) 25%, var(--board-light) 75%, var(--board-dark) 75%, var(--board-dark));
  background-size: auto, 90px 90px, 90px 90px;
  background-position: 0 0, 0 0, 45px 45px;
  background-attachment: fixed, fixed, fixed;
  min-height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px 14px;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  overflow-x:hidden;
}

#app{ width:100%; max-width:1040px; position:relative; }

.hidden{ display:none !important; }
.screen{ display:none; }
.screen.active{ display:block; animation:fadeUp .32s cubic-bezier(.2,.8,.25,1); }
@keyframes fadeUp{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:translateY(0);} }

.topbar{ display:flex; justify-content:flex-end; gap:10px; margin-bottom:10px; }
.iconBtn{
  width:40px; height:40px; border-radius:50%; border:none;
  background:var(--panel-bg); box-shadow:var(--shadow-md);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  color:var(--ink); transition:transform .15s ease, background .15s ease;
  border:1px solid var(--panel-border);
}
.iconBtn:hover{ transform:translateY(-2px); background:#31302c; }
.iconBtn:active{ transform:translateY(0) scale(.95); }
.iconBtn svg{ width:19px; height:19px; }

/* ---------------- Start screen ---------------- */
.startCard{
  background:rgba(30,29,26,0.86); border:1px solid var(--panel-border);
  border-radius:var(--radius-lg); box-shadow:var(--shadow-lg);
  padding:36px 30px 30px; text-align:center;
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
}
.logoMark{ width:64px; height:64px; margin:0 auto 10px; display:block; }
h1.title{
  font-family:var(--font-display); font-weight:800; letter-spacing:2px;
  font-size:clamp(38px,9vw,54px); margin:0 0 6px; color:var(--ink);
}
.tagline{ color:var(--dim); margin:0 0 28px; font-size:15px; }

.bigChoices{ display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin-bottom:6px; }
.choiceCard{
  flex:1 1 180px; max-width:220px; background:var(--panel-bg-2);
  border:2px solid var(--panel-border); border-radius:var(--radius-md);
  padding:22px 14px; cursor:pointer; transition:transform .15s ease, border-color .15s ease;
}
.choiceCard:hover{ transform:translateY(-3px); border-color:var(--accent); }
.choiceCard:active{ transform:translateY(0); }
.choiceCard svg{ width:40px; height:40px; margin-bottom:10px; color:var(--accent); }
.choiceCard .ccTitle{ font-weight:700; font-size:16px; margin-bottom:4px; }
.choiceCard .ccSub{ font-size:12.5px; color:var(--dim); }

.panel{ margin-top:22px; text-align:left; }
.panelLabel{ font-size:12.5px; text-transform:uppercase; letter-spacing:1.2px; color:var(--dim-2); margin:18px 0 8px; font-weight:700; }
.pillRow{ display:flex; gap:10px; flex-wrap:wrap; }
.pillBtn{
  flex:1 1 auto; padding:12px 14px; border-radius:999px; border:2px solid var(--panel-border);
  background:var(--panel-bg-2); color:var(--ink); font-weight:600; font-size:14.5px; cursor:pointer;
  transition:all .15s ease; position:relative; display:flex; align-items:center; justify-content:center; gap:6px;
}
.pillBtn:hover{ border-color:var(--accent); }
.pillBtn.selected{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.pillBtn .lockBadge{ font-size:11px; background:rgba(0,0,0,0.28); padding:2px 7px; border-radius:999px; }
.pillBtn.selected .lockBadge{ background:rgba(0,0,0,0.18); }

.primaryBtn{
  width:100%; margin-top:26px; padding:15px; border:none; border-radius:999px;
  background:var(--accent); color:var(--accent-ink); font-weight:800; font-size:16px;
  cursor:pointer; box-shadow:0 8px 20px rgba(129,182,76,0.35); transition:transform .15s ease, filter .15s ease;
}
.primaryBtn:hover{ filter:brightness(1.06); transform:translateY(-2px); }
.primaryBtn:active{ transform:translateY(0); }
.primaryBtn:disabled{ opacity:.5; cursor:not-allowed; transform:none; }

.backLink{ display:inline-block; margin-top:16px; color:var(--dim); font-size:13.5px; cursor:pointer; text-decoration:underline; }

/* ---------------- Game screen ---------------- */
.gameWrap{ display:flex; gap:18px; align-items:flex-start; flex-wrap:wrap; justify-content:center; }
.boardCol{ flex:1 1 460px; max-width:600px; min-width:290px; }
.sideCol{ flex:0 1 300px; min-width:260px; }

.playerBar{
  display:flex; align-items:center; justify-content:space-between;
  background:var(--panel-bg); border:1px solid var(--panel-border);
  border-radius:var(--radius-sm); padding:9px 13px; margin-bottom:8px; gap:10px;
}
.playerBar.bottomBar{ margin-bottom:0; margin-top:8px; }
.playerInfo{ display:flex; align-items:center; gap:9px; min-width:0; }
.playerAvatar{
  width:30px; height:30px; border-radius:8px; flex:none;
  display:flex; align-items:center; justify-content:center; font-size:15px;
}
.playerAvatar.avW{ background:#f2f0ec; color:#222; }
.playerAvatar.avB{ background:#2b2a27; color:#f2f0ec; border:1px solid #46433d; }
.playerName{ font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.playerName .thinkingDots{ color:var(--gold); font-weight:600; font-size:12.5px; margin-left:6px; }
.capturedTray{ display:flex; align-items:center; gap:1px; flex-wrap:wrap; min-height:18px; }
.capturedTray svg{ width:16px; height:16px; margin-right:-6px; }
.capturedTray .matAdv{ margin-left:8px; font-size:12.5px; color:var(--dim); font-weight:700; }

.boardOuter{ position:relative; width:100%; aspect-ratio:1; border-radius:6px; overflow:hidden; box-shadow:var(--shadow-lg); }
.board{
  position:absolute; inset:0; display:grid;
  grid-template-columns:repeat(8,1fr); grid-template-rows:repeat(8,1fr);
}
.sq{ position:relative; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.sq.sqLight{ background:var(--board-light); }
.sq.sqDark{ background:var(--board-dark); }
.sq .coordLabel{ position:absolute; font-size:10.5px; font-weight:700; opacity:.85; pointer-events:none; }
.sq .coordFile{ right:3px; bottom:1px; }
.sq .coordRank{ left:3px; top:1px; }
.sq.sqLight .coordLabel{ color:var(--board-dark); }
.sq.sqDark .coordLabel{ color:var(--board-light); }

.sqOverlay{ position:absolute; inset:0; pointer-events:none; }
.sq.lastMove .sqOverlay{ background:var(--highlight); opacity:var(--highlight-alpha); }
.sq.selected .sqOverlay{ background:var(--highlight); opacity:0.78; }
.sq.inCheck .sqOverlay{ background:radial-gradient(circle, rgba(232,83,79,0.95) 0%, rgba(232,83,79,0.55) 45%, rgba(232,83,79,0) 78%); }

.moveDot{ position:absolute; width:32%; height:32%; border-radius:50%; background:var(--dot); pointer-events:none; }
.captureRing{ position:absolute; width:86%; height:86%; border-radius:50%; border:5px solid var(--ring); box-sizing:border-box; pointer-events:none; }

.piece{ width:84%; height:84%; display:block; filter:drop-shadow(0 2px 2px rgba(0,0,0,0.35)); }
.piece.pieceWhite{ fill:#fbfbf8; stroke:#33312c; stroke-width:2.4; stroke-linejoin:round; color:#33312c; }
.piece.pieceBlack{ fill:#3a3a3a; stroke:#0f0f0f; stroke-width:2.4; stroke-linejoin:round; color:#e8e6e0; }
.sq.draggableSelf{ cursor:grab; }

.controlsRow{ display:flex; gap:8px; margin-top:12px; }
.ctrlBtn{
  flex:1; padding:11px; border-radius:10px; border:1px solid var(--panel-border);
  background:var(--panel-bg); color:var(--ink); font-weight:700; font-size:13.5px; cursor:pointer;
}
.ctrlBtn:hover{ background:#31302c; }
.ctrlBtn.ctrlAccent{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }

.sidePanel{ background:var(--panel-bg); border:1px solid var(--panel-border); border-radius:var(--radius-md); padding:14px; }
.sidePanelTitle{ font-size:12px; text-transform:uppercase; letter-spacing:1.2px; color:var(--dim-2); font-weight:700; margin-bottom:8px; }
.moveList{ max-height:260px; overflow-y:auto; font-size:13.5px; line-height:1.9; }
.moveList .mvRow{ display:flex; gap:8px; }
.moveList .mvNum{ color:var(--dim-2); width:26px; flex:none; }
.moveList .mvWhite,.moveList .mvBlack{ flex:1; padding:1px 6px; border-radius:4px; }
.moveList .mvWhite.current,.moveList .mvBlack.current{ background:rgba(129,182,76,0.22); }
.statusLine{ margin-top:12px; padding-top:12px; border-top:1px solid var(--panel-border); font-size:13px; color:var(--dim); }

/* ---------------- Modals ---------------- */
.modalScrim{ position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
.modalCard{ background:var(--panel-bg); border:1px solid var(--panel-border); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); padding:26px; max-width:360px; width:100%; text-align:center; }
.modalCard h2{ margin:0 0 6px; font-family:var(--font-display); font-size:24px; letter-spacing:.5px; }
.modalCard p{ color:var(--dim); font-size:14px; margin:0 0 18px; }
.promoRow{ display:flex; gap:10px; justify-content:center; margin-bottom:6px; }
.promoChoice{ width:64px; height:64px; border-radius:12px; background:var(--panel-bg-2); border:2px solid var(--panel-border); cursor:pointer; display:flex; align-items:center; justify-content:center; }
.promoChoice:hover{ border-color:var(--accent); }
.promoChoice svg{ width:80%; height:80%; }
.modalBtnRow{ display:flex; gap:10px; margin-top:16px; }
.modalBtn{ flex:1; padding:12px; border-radius:999px; border:none; font-weight:700; cursor:pointer; font-size:14px; }
.modalBtn.primary{ background:var(--accent); color:var(--accent-ink); }
.modalBtn.secondary{ background:var(--panel-bg-2); color:var(--ink); border:1px solid var(--panel-border); }
.lockIcon{ width:46px; height:46px; color:var(--gold); margin:0 auto 10px; }
.priceTag{ display:inline-block; background:var(--panel-bg-2); border:1px solid var(--panel-border); padding:6px 16px; border-radius:999px; font-weight:800; font-size:15px; margin-bottom:16px; color:var(--gold); }
.toast{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:var(--panel-bg-2); border:1px solid var(--panel-border); color:var(--ink); padding:11px 18px; border-radius:999px; font-size:13.5px; box-shadow:var(--shadow-md); z-index:60; }

/* ---------------- Achievements screen ---------------- */
.achList{ display:flex; flex-direction:column; gap:10px; margin-top:18px; text-align:left; }
.achRow{ display:flex; align-items:center; gap:12px; background:var(--panel-bg-2); border:1px solid var(--panel-border); border-radius:12px; padding:11px 14px; }
.achRow.unlocked{ background:linear-gradient(135deg, rgba(129,182,76,0.28), rgba(129,182,76,0.10)); border-color:var(--accent); }
.achIcon{ width:34px; height:34px; flex:none; border-radius:9px; background:rgba(255,255,255,0.06); display:flex; align-items:center; justify-content:center; }
.achRow.unlocked .achIcon{ background:var(--accent); color:var(--accent-ink); }
.achRow:not(.unlocked) .achIcon{ color:var(--dim-2); }
.achText .achName{ font-weight:700; font-size:14px; }
.achText .achDesc{ font-size:12px; color:var(--dim); }

/* ---------------- Leaderboard screen ---------------- */
.myRatingCard{ background:linear-gradient(135deg, rgba(129,182,76,0.22), rgba(129,182,76,0.06)); border:1px solid var(--accent); border-radius:16px; padding:16px 20px; margin-bottom:18px; }
.myRatingLabel{ font-size:12px; text-transform:uppercase; letter-spacing:1.2px; color:var(--dim-2); font-weight:700; }
.myRatingValue{ font-family:var(--font-display); font-size:40px; font-weight:800; color:var(--ink); line-height:1.2; }
.myRatingRank{ font-size:13px; color:var(--dim); margin-top:2px; }
.lbList{ display:flex; flex-direction:column; gap:8px; text-align:left; }
.lbRow{ display:flex; align-items:center; gap:12px; background:var(--panel-bg-2); border:1px solid var(--panel-border); border-radius:10px; padding:9px 14px; }
.lbRow.me{ border-color:var(--accent); background:linear-gradient(135deg, rgba(129,182,76,0.2), rgba(129,182,76,0.06)); }
.lbRank{ font-weight:800; color:var(--dim-2); width:26px; flex:none; }
.lbRow.me .lbRank{ color:var(--accent); }
.lbName{ flex:1; font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.lbScore{ font-weight:700; font-size:14px; color:var(--gold); }
.lbOfflineNote{ margin-top:14px; font-size:12.5px; color:var(--dim-2); font-style:italic; }
.lbEmpty{ color:var(--dim); font-size:13.5px; padding:14px 0; }

@media (max-width:700px){
  .gameWrap{ flex-direction:column; }
  .boardCol,.sideCol{ flex:1 1 auto; max-width:none; width:100%; }
}
</style>
</head>

  <!-- ===================== START SCREEN ===================== -->
  <div class="screen active" id="screen-start">
    <div class="topbar">

      <button class="iconBtn" id="btnStartFull" title="Fullscreen"><svg><use href="#ic-full"/></svg></button>
    </div>
    <div class="startCard">
      <svg class="logoMark" viewBox="0 0 100 100"><use href="#pc-k" class="piece" style="fill:#81b64c;stroke:#3a5c22;stroke-width:2.4"/></svg>
      <h1 class="title">CHESS</h1>
      <p class="tagline">Classic chess. Play a friend, or take on the computer.</p>

      <!-- 1P config panel -->
      <div class="panel hidden" id="panel1p">
        <div class="panelLabel">Play as</div>

  function renderBoard() {

    }
    var legalTargets = {};

    for (var row = 0; row < 8; row++) {
      for (var col = 0; col < 8; col++) {
        var idx = squareForDisplay(row, col);
        var isLight = (Engine.rankOf(idx) + Engine.fileOf(idx)) % 2 === 1;
        var div = document.createElement("div");
        div.className = "sq " + (isLight ? "sqLight" : "sqDark");

        if (lastMove && (idx === lastMove.from || idx === lastMove.to)) div.className += " lastMove";
        if (idx === selected) div.className += " selected";
        if (idx === kingInCheckSq) div.className += " inCheck";

        var overlay = document.createElement("div");
        overlay.className = "sqOverlay";
        div.appendChild(overlay);

        if (row === 7) {
          var fl = document.createElement("span");
          fl.className = "coordLabel coordFile";
          fl.textContent = "abcdefgh"[Engine.fileOf(idx)];

    if (move.captured) {
      if (move.color === Engine.WHITE) capturedByWhite.push(move.captured);
      else capturedByBlack.push(move.captured);
    }

    posHistory.push(Engine.positionKey(engineState));
    Engine.makeMove(engineState, move);
    sanMoves.push(san);

    renderAll();

    var status = Engine.getGameStatus(engineState, posHistory);
    if (status.over) {

      return;

    if (Engine.inCheck(engineState, engineState.turn)) Audio2.check();

    maybeTriggerAiMove();
  }

  function maybeTriggerAiMove() {
    if (mode !== "1p" || gameOver) return;
    if (engineState.turn === humanColor) return;
    aiThinking = true;
    renderPlayerBars();
    var myRequestId = ++aiRequestId;
    var stateCopy = Engine.cloneState(engineState);
    var difficulty = aiDifficulty;

    function applyAiMove(move) {
      if (myRequestId !== aiRequestId) return; // stale response (user left the game)
      aiThinking = false;
      if (!move) { renderPlayerBars(); return; }
      commitMove(move);
    }

    if (aiWorker) {
      var handler = function (e) {
        if (e.data.requestId !== myRequestId) return;
        aiWorker.removeEventListener("message", handler);
        applyAiMove(e.data.move);

      aiWorker.addEventListener("message", handler);
      aiWorker.postMessage({ type: "think", state: stateCopy, difficulty: difficulty, requestId: myRequestId });

      setTimeout(function () {
        var move = AI.chooseMove(stateCopy, difficulty);
        applyAiMove(move);
      }, 50);
    }
  }

  function handleGameOver(status) {
    gameOver = true;
    renderAll();
    var title = "", sub = "";
    var humanWon = false;
    if (status.result === "checkmate") {
      var winnerName = status.winner === Engine.WHITE ? "White" : "Black";
      title = "Checkmate"; sub = winnerName + " wins.";
      if (mode === "2p") humanWon = true;
      else if (status.winner === humanColor) humanWon = true;
    } else if (status.result === "stalemate") { title = "Stalemate"; sub = "The game is a draw."; }

    else if (status.result === "insufficient-material") { title = "Draw"; sub = "Draw by insufficient material."; }
    else if (status.result === "repetition") { title = "Draw"; sub = "Draw by threefold repetition."; }

    Audio2.gameEnd(humanWon || mode === "2p" && status.result === "checkmate");

    document.getElementById("resultTitle").textContent = title;
    document.getElementById("resultSub").textContent = sub;
    document.getElementById("resultModal").classList.remove("hidden");

  function showScreen(id) {
    document.querySelectorAll(".screen").forEach(function (s) { s.classList.remove("active"); });
    document.getElementById(id).classList.add("active");
  }


  // ==================================================================
  // Wire up UI
  // ==================================================================
  // This page plays one mode only (set by ?mode= in the URL):
  // easy / medium / hard = 1 player vs the AI, 2p = pass and play.
  var MODE_PARAM = new URLSearchParams(location.search).get("mode");
  var PAGE_MODE = (MODE_PARAM === "2p" || MODE_PARAM === "medium" || MODE_PARAM === "hard") ? MODE_PARAM : "easy";
  var DIFF_LABELS = { easy: "Easy", medium: "Medium", hard: "Hard" };
  if (PAGE_MODE === "2p") {
    document.getElementById("panel1p").remove();
    document.getElementById("panel2p").classList.remove("hidden");
    document.querySelector("#screen-start .tagline").textContent = "2 players, pass and play on the same device.";
  } else {
    selectedDifficulty = PAGE_MODE;
    document.getElementById("panel2p").remove();
    document.getElementById("panel1p").classList.remove("hidden");
    document.querySelector("#screen-start .tagline").textContent = "Play the computer \u00b7 " + DIFF_LABELS[PAGE_MODE];
  }

  var colorPicker = document.getElementById("colorPicker");
  if (colorPicker) colorPicker.addEventListener("click", function (e) {
    var btn = e.target.closest(".pillBtn"); if (!btn) return;
    Audio2.click();
    document.querySelectorAll("#colorPicker .pillBtn").forEach(function (b) { b.classList.remove("selected"); });
    btn.classList.add("selected");
    selectedPlayColor = btn.dataset.color;
  });

  if (PAGE_MODE !== "2p") document.getElementById("btnStart1p").addEventListener("click", function () {
    Audio2.unlock(); Audio2.click();
    mode = "1p";
    if (selectedPlayColor === "rand") humanColor = Math.random() < 0.5 ? Engine.WHITE : Engine.BLACK;
    else humanColor = selectedPlayColor;
    aiDifficulty = selectedDifficulty;
    showScreen("screen-game");
    newGame();
  });
  if (PAGE_MODE === "2p") document.getElementById("btnStart2p").addEventListener("click", function () {
    Audio2.unlock(); Audio2.click();
    mode = "2p"; humanColor = null; aiDifficulty = null;
    showScreen("screen-game");
    newGame();
  });

  document.getElementById("btnNewGame").addEventListener("click", function () { Audio2.click(); newGame(); });
  document.getElementById("btnBackMenu").addEventListener("click", function () { Audio2.click(); aiRequestId++; showScreen("screen-start"); });
  document.getElementById("btnGameMenu").addEventListener("click", function () { Audio2.click(); aiRequestId++; showScreen("screen-start"); });

  document.getElementById("btnResultMenu").addEventListener("click", function () {
    document.getElementById("resultModal").classList.add("hidden");
    aiRequestId++; showScreen("screen-start");
  });
  document.getElementById("btnResultRematch").addEventListener("click", function () {
    document.getElementById("resultModal").classList.add("hidden");
    newGame();
  });

  function toggleMute(btnIds) {
    var muted = !Platform.isMuted();
    Audio2.setMuted(muted);
    btnIds.forEach(function (id) {
      document.getElementById(id).innerHTML = muted ? '<svg><use href="#ic-mute"/></svg>' : '<svg><use href="#ic-sound"/></svg>';
    });
  }
  document.getElementById("btnStartMute").addEventListener("click", function () { toggleMute(["btnStartMute", "btnGameMute"]); });
  document.getElementById("btnGameMute").addEventListener("click", function () { toggleMute(["btnStartMute", "btnGameMute"]); });
  document.getElementById("btnStartFull").addEventListener("click", function () { Platform.requestFullscreen(); });
  document.getElementById("btnGameFull").addEventListener("click", function () { Platform.requestFullscreen(); });

  // ==================================================================
  // Boot
  // ==================================================================
  if (Platform.isMuted()) {
    document.getElementById("btnStartMute").innerHTML = '<svg><use href="#ic-mute"/></svg>';
    document.getElementById("btnGameMute").innerHTML = '<svg><use href="#ic-mute"/></svg>';
  }

  showScreen("screen-start");
})();
</script>
</body>
</html>
